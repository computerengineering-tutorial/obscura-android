name: Android Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      NUM_JOBS: 2
      # Disable internal Chromium Rust submodules & Temporal, provide NDK version for clean C++ V8 build
      GN_ARGS: 'android_ndk_version="r26d" symbol_level=0 v8_symbol_level=0 blink_symbol_level=0 is_debug=false treat_warnings_as_errors=false enable_rust=false enable_rust_cxx=false v8_enable_temporal_support=false v8_enable_fast_mksnapshot=true'
      EXTRA_GN_ARGS: 'android_ndk_version="r26d" symbol_level=0 v8_symbol_level=0 blink_symbol_level=0 is_debug=false treat_warnings_as_errors=false enable_rust=false enable_rust_cxx=false v8_enable_temporal_support=false v8_enable_fast_mksnapshot=true'
      # Target flags strictly for Android aarch64 (never applied to host proc-macros/tools):
      # ARM NEON SIMD vectorization, opt-level=3, codegen-units=1, linker GC & O3
      CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C opt-level=3 -C target-feature=+neon -C codegen-units=1 -C debuginfo=0 -C strip=symbols -C link-arg=-Wl,-O3 -C link-arg=-Wl,--gc-sections"
      OBSCURA_NO_SNAPSHOT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Export NDK environment
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libglib2.0-dev unzip zip

      - name: Install cargo-ndk
        run: env -u RUSTFLAGS -u CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS cargo install cargo-ndk --locked

      - name: Download V8 ICU data
        run: |
          mkdir -p /tmp/obscura-v8-icu
          echo "Downloading V8 common icudtl.dat (~11MB)..."
          curl -fsSL "https://chromium.googlesource.com/chromium/deps/icu/+/ee5f27adc28bd3f15b2c293f726d14d2e336cbd5/common/icudtl.dat?format=TEXT" | base64 -d > /tmp/obscura-v8-icu/icudtl.dat
          echo "Downloading V8 Android icudtl.dat (~9MB)..."
          curl -fsSL "https://chromium.googlesource.com/chromium/deps/icu/+/ee5f27adc28bd3f15b2c293f726d14d2e336cbd5/android/icudtl.dat?format=TEXT" | base64 -d > /tmp/obscura-v8-icu/icudtl_android.dat || cp /tmp/obscura-v8-icu/icudtl.dat /tmp/obscura-v8-icu/icudtl_android.dat
          test -s /tmp/obscura-v8-icu/icudtl.dat
          test -s /tmp/obscura-v8-icu/icudtl_android.dat

      - name: Check and prepare prebuilt V8 binaries
        run: |
          mkdir -p /tmp/obscura-v8-prebuilt
          ARCHIVE_FILE="/tmp/obscura-v8-prebuilt/librusty_v8_release_aarch64-linux-android.a.gz"
          BINDING_FILE="/tmp/obscura-v8-prebuilt/src_binding_release_aarch64-linux-android.rs"
          echo "Checking if prebuilt V8 is published in GitHub Releases..."
          V8_RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/v8-android-v150.4.0"
          if curl -fsSL -I "$V8_RELEASE_URL/librusty_v8_release_aarch64-linux-android.a.gz" >/dev/null 2>&1; then
            echo "Downloading prebuilt V8 archive from $V8_RELEASE_URL..."
            curl -fsSL "$V8_RELEASE_URL/librusty_v8_release_aarch64-linux-android.a.gz" -o "$ARCHIVE_FILE"
            curl -fsSL "$V8_RELEASE_URL/src_binding_release_aarch64-linux-android.rs" -o "$BINDING_FILE"
            echo "✅ Successfully downloaded prebuilt V8 from GitHub Release!"
          else
            echo "ℹ️ Prebuilt V8 release asset not found; clean build will be compiled."
          fi

      - name: Fetch crate dependencies, configure V8 for target, and inject ICU data
        run: |
          cargo fetch --target aarch64-linux-android

          # Unpack v8 and deno_core crates
          for crate in $(find ~/.cargo/registry/cache/ -name "v8-150*.crate" 2>/dev/null); do
            src_dir="${crate%/cache/*}/src/${crate##*/cache/}"
            src_dir="${src_dir%/*}/v8-150.4.0"
            mkdir -p "$src_dir"
            tar -xzf "$crate" -C "$src_dir" --strip-components=1 2>/dev/null || true
          done
          for crate in $(find ~/.cargo/registry/cache/ -name "deno_core-0.412*.crate" 2>/dev/null); do
            src_dir="${crate%/cache/*}/src/${crate##*/cache/}"
            src_dir="${src_dir%/*}/deno_core-0.412.0"
            mkdir -p "$src_dir"
            tar -xzf "$crate" -C "$src_dir" --strip-components=1 2>/dev/null || true
          done

          # Patch v8 and deno_core crates for Android cross-compilation
          for v8_dir in $(find ~/.cargo/registry/src/ -type d -name "v8-*" 2>/dev/null); do
            python3 .github/scripts/patch_v8.py "$v8_dir"
          done
          for deno_dir in $(find ~/.cargo/registry/src/ -type d -name "deno_core-*" 2>/dev/null); do
            p="$deno_dir/uv_compat/tty.rs"
            if [ -f "$p" ]; then
              sed -i '/#\[cfg(not(any(target_os = "macos", target_os = "linux")))\]/c\  #[cfg(target_os = "android")]\n  fn errno_location() -> *mut c_int {\n    unsafe extern "C" {\n      fn __errno() -> *mut c_int;\n    }\n    unsafe { __errno() }\n  }\n\n  #[cfg(not(any(target_os = "macos", target_os = "linux", target_os = "android")))]' "$p"
            fi
          done

          # Skip heavy C++ V8 tree patching and sysroot download if prebuilt V8 is ready
          ARCHIVE_FILE="/tmp/obscura-v8-prebuilt/librusty_v8_release_aarch64-linux-android.a.gz"
          BINDING_FILE="/tmp/obscura-v8-prebuilt/src_binding_release_aarch64-linux-android.rs"
          if [ -s "$ARCHIVE_FILE" ] && [ -s "$BINDING_FILE" ]; then
            echo "⚡ Prebuilt V8 archive is present! Skipping C++ V8 tree patching and sysroot setup."
            exit 0
          fi

          for v8_dir in $(find ~/.cargo/registry/src/ -type d -name "v8-*" 2>/dev/null); do
            echo "Configuring V8 in $v8_dir"

            # 1. Inject ICU data files (common for host, android for target)
            mkdir -p "$v8_dir/third_party/icu/common" "$v8_dir/third_party/icu/android"
            cp /tmp/obscura-v8-icu/icudtl.dat "$v8_dir/third_party/icu/common/icudtl.dat"
            if [ -s /tmp/obscura-v8-icu/icudtl_android.dat ]; then
              cp /tmp/obscura-v8-icu/icudtl_android.dat "$v8_dir/third_party/icu/android/icudtl.dat"
            else
              cp /tmp/obscura-v8-icu/icudtl.dat "$v8_dir/third_party/icu/android/icudtl.dat"
            fi
            test -s "$v8_dir/third_party/icu/common/icudtl.dat"
            test -s "$v8_dir/third_party/icu/android/icudtl.dat"

            # 2. Symlink Android NDK
            mkdir -p "$v8_dir/third_party/android_toolchain"
            ln -sfn "$ANDROID_NDK_HOME" "$v8_dir/third_party/android_toolchain/ndk"
            ln -sfn "$ANDROID_NDK_HOME" "$v8_dir/third_party/android_ndk"

            # 3. Create dummy third_party directories so build.rs skips git cloning catapult
            mkdir -p "$v8_dir/third_party/android_platform"
            mkdir -p "$v8_dir/third_party/catapult"

            # 4. Patch build/config/android/BUILD.gn so android_ndk_version is always defined
            if [ -f "$v8_dir/build/config/android/BUILD.gn" ]; then
              if ! grep -q "android_ndk_version =" "$v8_dir/build/config/android/BUILD.gn"; then
                sed -i '1s/^/if (!defined(android_ndk_version)) { android_ndk_version = "r26d" }\nif (!defined(android_ndk_root)) { android_ndk_root = "\/\/third_party\/android_toolchain\/ndk" }\n/' "$v8_dir/build/config/android/BUILD.gn"
              fi
            fi

            # 5. Disable test_runner_py in v8/tools/BUILD.gn
            if [ -f "$v8_dir/v8/tools/BUILD.gn" ]; then
              python3 -c "import re; p = '$v8_dir/v8/tools/BUILD.gn'; s = open(p).read(); open(p, 'w').write(re.sub(r'group\(\"v8_android_test_runner_deps\"\)\s*\{[\s\S]*?(?=\ngroup\(\"v8_testrunner\"\))', 'group(\"v8_android_test_runner_deps\") {\n  testonly = true\n}\n', s))"
            fi

            # 6. Create stub pydeps files so GN never fails on missing Chromium python test scripts
            mkdir -p "$v8_dir/build/android/pylib/results/presentation" "$v8_dir/build/android/test_wrapper"
            touch "$v8_dir/build/android/pylib/results/presentation/test_results_presentation.pydeps" \
                  "$v8_dir/build/android/devil_chromium.pydeps" \
                  "$v8_dir/build/android/apk_operations.pydeps" \
                  "$v8_dir/build/android/test_runner.pydeps" \
                  "$v8_dir/build/android/test_wrapper/logdog_wrapper.pydeps" \
                  "$v8_dir/build/android/resource_sizes.pydeps"

            # 7. Install Debian Bullseye amd64 sysroot for host toolchain (mksnapshot)
            mkdir -p "$v8_dir/build/linux"
            echo "Installing Debian amd64 sysroot via install-sysroot.py..."
            python3 "$v8_dir/build/linux/sysroot_scripts/install-sysroot.py" --arch=amd64
            test -d "$v8_dir/build/linux/debian_bullseye_amd64-sysroot"
          done

      # ---------------- Build Obscura Android JNI Library ----------------
      - name: Build Obscura Android JNI library (.so)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          GN_ARGS: 'android_ndk_version="r26d" symbol_level=0 v8_symbol_level=0 blink_symbol_level=0 is_debug=false treat_warnings_as_errors=false enable_rust=false enable_rust_cxx=false v8_enable_temporal_support=false v8_enable_fast_mksnapshot=true'
          EXTRA_GN_ARGS: 'android_ndk_version="r26d" symbol_level=0 v8_symbol_level=0 blink_symbol_level=0 is_debug=false treat_warnings_as_errors=false enable_rust=false enable_rust_cxx=false v8_enable_temporal_support=false v8_enable_fast_mksnapshot=true'
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C opt-level=3 -C target-feature=+neon -C codegen-units=1 -C debuginfo=0 -C strip=symbols -C link-arg=-Wl,-O3 -C link-arg=-Wl,--gc-sections"
          OBSCURA_NO_SNAPSHOT: "1"
        run: |
          mkdir -p android/app/src/main/jniLibs
          PREBUILT_DIR="/tmp/obscura-v8-prebuilt"
          ARCHIVE_FILE="$PREBUILT_DIR/librusty_v8_release_aarch64-linux-android.a.gz"
          BINDING_FILE="$PREBUILT_DIR/src_binding_release_aarch64-linux-android.rs"

          if [ -s "$ARCHIVE_FILE" ] && [ -s "$BINDING_FILE" ]; then
            echo "⚡ Using precompiled V8 Android binary archive: $ARCHIVE_FILE"
            export RUSTY_V8_ARCHIVE="$ARCHIVE_FILE"
            export RUSTY_V8_SRC_BINDING_PATH="$BINDING_FILE"
            unset V8_FROM_SOURCE
          else
            echo "⚡ Compiling clean build for Android target"
            export V8_FROM_SOURCE=1
            unset RUSTY_V8_ARCHIVE
            unset RUSTY_V8_SRC_BINDING_PATH
            export OBSCURA_REBUILD_V8=0
          fi

          export NINJA_STATUS="[%f/%t (%p)] "

          python3 .github/scripts/throttle.py --interval 30 --label "Build Android JNI & V8" -- \
            cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release -p obscura-android -vv

      - name: Verify native library
        run: |
          test -f android/app/src/main/jniLibs/arm64-v8a/libobscura_android.so
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libobscura_android.so

      # ---------------- Build APK via Gradle ----------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-disabled: true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Stage APK for distribution
        run: |
          mkdir -p dist
          APK_PATH=$(find android/app/build/outputs/apk/debug/ -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" dist/obscura-android-arm64-v8a.apk
            echo "Staged APK at dist/obscura-android-arm64-v8a.apk"
            ls -lh dist/obscura-android-arm64-v8a.apk
          else
            echo "Error: No APK found in build outputs!" >&2
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: obscura-android-apk
          path: dist/obscura-android-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/obscura-android-arm64-v8a.apk
