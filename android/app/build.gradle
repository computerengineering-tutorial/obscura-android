plugins {
    id 'com.android.application'
}

android {
    namespace 'com.obscura.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.obscura.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        debug {
            // Built-in debug signing configuration auto-generates debug.keystore
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // Native Rust libraries (libobscura_android.so) will reside in jniLibs/<abi>/
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    // Ultra-lightweight: zero external runtime dependencies.
    // Pure native Android SDK without AndroidX or Material bloat.
}
